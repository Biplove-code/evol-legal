<style>
:root{--bg:#FFF8E6;--card:#fff;--text:#2B1A0E;--muted:#7A6A5A;--gold:#F5B82E;--line:#EBDDBF}

*{box-sizing:border-box}

ul{padding-inline-start:22px}
a{color:inherit;text-decoration-color:var(--gold);text-underline-offset:3px}
nav.links{display:flex;gap:16px;flex-wrap:wrap;margin-top:40px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:15px}
